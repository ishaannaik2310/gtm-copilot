[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtm-copilot"
version = "0.1.0"
description = "GTM Ops Copilot: AI-driven researched, fact-checked account brief generator backed by RAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.1",
    "chromadb>=0.4.0",
    "sentence-transformers",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gtm_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
