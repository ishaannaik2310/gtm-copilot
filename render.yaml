services:
  - type: web
    name: gtm-copilot-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn gtm_copilot.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ALLOWED_ORIGINS
        sync: false
